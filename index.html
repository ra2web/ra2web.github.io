    <style>

  <body class="no-js">
    <div id="ra2web-root">
      <div id="startup-load-check-host">
        <div
          id="startup-load-check"
          class="message-box game-res-box startup-load-check"
          data-state="loading"
          role="status"
          aria-live="polite"

          <div class="message-box-content">
            <div class="startup-load-check-heading">
              <div class="startup-load-check-spinner" aria-hidden="true"></div>
              <div>

                <div id="startup-load-check-status" class="startup-load-check-status">正在启动客户端...</div>
              </div>
            </div>
            <p id="startup-load-check-detail" class="startup-load-check-detail">
              正在检测客户端配置、界面资源和游戏资源清单。
            </p>
            <div class="startup-load-check-progress-meta">
              <span>加载版本：<strong id="startup-load-check-version">0.85.0-r2e3b64c-d489299c2</strong></span>
              <span>启动进度</span>
            </div>
            <div
              id="startup-load-check-progress"
              class="startup-load-check-progress"
              role="progressbar"
              aria-label="启动进度"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="15"
            >
              <div id="startup-load-check-progress-bar" class="startup-load-check-progress-bar"></div>
            </div>
            <p class="startup-load-check-hint">如果页面长时间停留在这里，可以重新加载后再试。</p>
            <p class="startup-load-check-feedback">
              遇到问题，可访问
              <a href="https://feedback.ra2web.com" target="_blank" rel="noopener noreferrer">feedback.ra2web.com</a>
              反馈问题。
            </p>
          </div>
          <div class="message-box-footer">
            <button
              id="startup-load-check-retry"
              class="dialog-button"
              type="button"
              hidden
              onclick="location.reload()"
            >
              重新加载
            </button>
          </div>
        </div>
      </div>

    <script id="startup-load-check-runtime">
      (() => {
        const root = document.getElementById('ra2web-root');
        const host = document.getElementById('startup-load-check-host');
        const panel = document.getElementById('startup-load-check');
        const title = document.getElementById('startup-load-check-title');
        const status = document.getElementById('startup-load-check-status');
        const detail = document.getElementById('startup-load-check-detail');
        const progress = document.getElementById('startup-load-check-progress');
        const progressBar = document.getElementById('startup-load-check-progress-bar');
        const retry = document.getElementById('startup-load-check-retry');
        if (!root || !host || !panel || !title || !status || !detail || !progress || !progressBar || !retry) return;

        let active = true;
        let mainUiObserver;
        const formatReason = (reason) => {
          if (typeof reason === 'string') return reason;
          if (reason && typeof reason.message === 'string') return reason.message;
          const targetUrl = reason && reason.target && (reason.target.src || reason.target.href);
          if (targetUrl) {
            try {
              const url = new URL(targetUrl, location.href);
              return `无法加载 ${url.origin}${url.pathname}`;
            } catch (_) {
              return '浏览器未能加载启动资源。';
            }
          }
          return '';
        };
        const setProgress = (value) => {
          if (!active || !Number.isFinite(value)) return;
          const normalized = Math.max(0, Math.min(100, Math.round(value)));
          progress.setAttribute('aria-valuenow', String(normalized));
          progressBar.style.width = `${normalized}%`;
        };
        const setPhase = (message, description, progressValue) => {
          if (!active) return;
          if (message) status.textContent = String(message);
          if (description) detail.textContent = String(description);
          if (typeof progressValue === 'number') setProgress(progressValue);
        };
        const fail = (message, reason) => {
          if (!active) return;
          clearTimeout(slowTimer);
          panel.dataset.state = 'error';
          title.textContent = '加载检测未通过';
          status.textContent = message || '客户端未能继续加载';
          detail.textContent = formatReason(reason) || '请检查网络连接，然后重新加载页面。';
          retry.hidden = false;
        };
        const onWindowError = (event) => fail('启动资源加载失败', event.error || event);
        const onUnhandledRejection = (event) => fail('客户端初始化失败', event.reason);
        const onOffline = () => fail('网络连接已断开', '浏览器当前处于离线状态。');
        const slowTimer = setTimeout(() => {
          if (!active || panel.dataset.state === 'error') return;
          panel.dataset.state = 'slow';
          status.textContent = '加载时间较长';
          detail.textContent = '资源清单或启动文件仍未完成加载，请检查网络连接。';
          retry.hidden = false;
        }, 15000);
        const dismiss = () => {
          if (!active) return;
          active = false;
          clearTimeout(slowTimer);
          window.removeEventListener('error', onWindowError, true);
          window.removeEventListener('unhandledrejection', onUnhandledRejection);
          window.removeEventListener('offline', onOffline);
          mainUiObserver?.disconnect();
          host.remove();
          delete window.__ra2webStartupLoadCheck;
        };

        window.addEventListener('error', onWindowError, true);
        window.addEventListener('unhandledrejection', onUnhandledRejection);
        window.addEventListener('offline', onOffline);
        window.__ra2webStartupLoadCheck = { dismiss, fail, setPhase, setProgress };
        document.body.classList.remove('no-js');

        if (typeof MutationObserver === 'function') {
          mainUiObserver = new MutationObserver(() => {
            if ([...root.children].some((child) => child !== host)) dismiss();
          });
          mainUiObserver.observe(root, { childList: true });
        }

        if (!browserSupported) {
          fail('当前浏览器不受支持', '请使用最新版 Google Chrome、Mozilla Firefox 或 Microsoft Edge。');
        } else if (navigator.onLine === false) {
          onOffline();
        }
      })();
    </script>
