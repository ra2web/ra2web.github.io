          }));
        });
      });
    });
  }

  var ready = document.readyState !== 'loading' ? Promise.resolve() : new Promise(function (resolve) {
    document.addEventListener('DOMContentLoaded', resolve, { once: true });
  });
  Promise.all([ready, controllerInfo().then(prepareLegacyController)]).then(start, function (error) {
    window.__ra2webStartupLoadCheck.fail('启动依赖加载失败', error, vendorUrl, 'resource');
  });
})();
</script>
